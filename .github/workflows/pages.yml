# Deploys the gabi.ph static site to GitHub Pages.
# One-time setting: Settings > Pages > Build and deployment > Source = "GitHub Actions".
name: Deploy gabi.ph to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Assemble the public site
        run: |
          set -euo pipefail
          mkdir -p _site
          rsync -a --exclude '.git' --exclude '.github' --exclude '_b64' --exclude '_site' --exclude 'README.md' ./ _site/
          # Binary assets pushed as base64 text (by the API connector) are decoded here.
          if [ -d _b64 ]; then
            find _b64 -type f -name '*.b64' | while read -r f; do
              out="_site/${f#_b64/}"; out="${out%.b64}"
              mkdir -p "$(dirname "$out")"; base64 -d "$f" > "$out"
            done
          fi
          test -f _site/index.html && test -f _site/CNAME
          find _site -type f | sort
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
